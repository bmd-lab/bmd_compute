<!DOCTYPE html>
<html>

<head>

<title>BMD Compute</title>

<style>

body {
    background: #161616;
    color: #f2f2f2;
    font-family: Arial, sans-serif;
    margin: 0;
}

.container {
    width: 700px;
    margin: 60px auto;
}

.header {
    margin-bottom: 30px;
}

h1 {
    font-size: 32px;
    margin-bottom: 5px;
}

.subtitle {
    color: #9e9e9e;
}

.panel {
    background: #242424;
    border: 1px solid #3a3a3a;
    border-radius: 12px;
    padding: 28px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    color: #cccccc;
}

input,
select,
textarea {

    width: 100%;
    padding: 10px;

    background: #181818;
    color: #f2f2f2;

    border: 1px solid #555;
    border-radius: 6px;

    box-sizing: border-box;
}

textarea {
    font-family: Consolas, monospace;
    resize: vertical;
}

button {
    margin-top: 24px;

    width: 100%;
    padding: 12px;

    background: #4FC3F7;
    color: black;

    border: none;
    border-radius: 6px;

    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #81D4FA;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>BMD Compute</h1>

        <div class="subtitle">
            Atomate2 / VASP workflow submission interface
        </div>

    </div>

    <div class="panel">

        <form action="/analyze" method="post">

            <label>Structure Format</label>

            <select name="fmt">

                <option value="poscar">POSCAR</option>

                <option value="cif">CIF</option>

            </select>

            <label>Structure</label>

            <textarea
                name="structure"
                rows="14"
                placeholder="Paste your POSCAR or CIF here..."></textarea>

            <label>Workflow</label>

            <select name="workflow">

                <option>Static</option>

                <option>Relaxation</option>

                <option>Band Structure</option>

            </select>

            <button type="submit">

                Analyze Structure

            </button>

        </form>

    </div>

</div>

</body>

</html>
