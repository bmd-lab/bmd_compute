<!DOCTYPE html>
<html>
<head>
<title>BMD Compute</title>

<style>
body {
    background: #161616;
    color: #f2f2f2;
    font-family: Arial, sans-serif;
    margin: 0;
}

.container {
    width: 620px;
    margin: 70px auto;
}

.header {
    margin-bottom: 30px;
}

h1 {
    font-size: 32px;
    margin-bottom: 5px;
}

.subtitle {
    color: #9e9e9e;
}

.panel {
    background: #242424;
    border: 1px solid #3a3a3a;
    border-radius: 12px;
    padding: 28px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    color: #cccccc;
}

input, select {
    width: 100%;
    padding: 10px;
    background: #181818;
    color: #f2f2f2;
    border: 1px solid #555;
    border-radius: 6px;
}

button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background: #4FC3F7;
    color: #000;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>BMD Compute</h1>
        <div class="subtitle">Atomate2 / VASP workflow submission interface</div>
    </div>

    <div class="panel">
        <form>
            <label>Structure file</label>
            <input type="file" name="structure">

            <label>Workflow</label>
            <select name="workflow">
                <option>Static</option>
                <option>Relaxation</option>
                <option>Band Structure</option>
            </select>

            <button type="button">Submit Workflow</button>
        </form>
    </div>

</div>
</body>
</html>
